<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Naakte Vrouw Prototype v17</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a12; color: #eee; overflow: hidden; }
    #ui {
      position: absolute; bottom: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.88); padding: 14px; border-radius: 14px;
      max-height: 48vh; overflow-y: auto; font-size: 14px; z-index: 100;
    }
    .slider-row { display: flex; align-items: center; margin: 7px 0; gap: 10px; }
    .slider-row label { width: 90px; }
    .slider-row input[type=range] { flex: 1; accent-color: #e91e63; }
    .slider-row span { width: 42px; text-align: right; }
    button { background: #e91e63; color: white; border: none; padding: 10px 16px; border-radius: 10px; margin-top: 6px; }
    h3 { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="ui">
    <h3>Naakte Vrouw <span style="color:#e91e63;">v17</span></h3>
    <div id="status">Realistisch CC0 model laden...</div>
    <div class="slider-row"><label>Borsten</label><input type="range" id="breast" min="0.6" max="1.8" step="0.05" value="1"><span id="breastVal">1.0</span></div>
    <div class="slider-row"><label>Taille</label><input type="range" id="waist" min="0.7" max="1.4" step="0.05" value="1"><span id="waistVal">1.0</span></div>
    <div class="slider-row"><label>Heupen</label><input type="range" id="hips" min="0.7" max="1.6" step="0.05" value="1"><span id="hipsVal">1.0</span></div>
    <div class="slider-row"><label>Lengte</label><input type="range" id="height" min="0.85" max="1.15" step="0.02" value="1"><span id="heightVal">1.00</span></div>
    <button id="resetBtn">Reset</button>
    <p style="margin-top:10px; font-size:12px; opacity:0.65;">Sleep om te draaien · Pinch om te zoomen</p>
  </div>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12121f);
    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3.2);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.9, 0);
    controls.enableDamping = true;
    controls.minDistance = 1.2;
    controls.maxDistance = 8;
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(2.5, 4, 2);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xaaaaff, 0.35);
    fill.position.set(-2, 2, -1);
    scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 12),
      new THREE.MeshStandardMaterial({ color: 0x1a1a28, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    let model;
    const loader = new GLTFLoader();
    loader.load(
      'https://raw.githubusercontent.com/075diice/3d-character-prototype/main/models/female-base.glb',
      (gltf) => {
        model = gltf.scene;
        model.scale.set(1, 1, 1);
        model.position.y = 0;
        model.traverse(c => {
          if (c.isMesh) {
            c.castShadow = true;
            c.receiveShadow = true;
            if (c.material) c.material.roughness = 0.6;
          }
        });
        scene.add(model);
        document.getElementById('status').textContent = 'Realistisch CC0 model geladen (Innerscene)';
        updateCharacter();
      },
      undefined,
      (err) => {
        document.getElementById('status').textContent = 'Fout bij laden model: ' + err.message;
        console.error(err);
      }
    );

    function updateCharacter() {
      if (!model) return;
      const b = +document.getElementById('breast').value;
      const w = +document.getElementById('waist').value;
      const h = +document.getElementById('hips').value;
      const ht = +document.getElementById('height').value;
      // Simple whole-body proportional scale for now (better than nothing)
      model.scale.set(1 + (b-1)*0.08, ht, 1 + (h-1)*0.12);
      model.position.y = (ht - 1) * 0.05;
      document.getElementById('breastVal').textContent = b.toFixed(1);
      document.getElementById('waistVal').textContent = w.toFixed(1);
      document.getElementById('hipsVal').textContent = h.toFixed(1);
      document.getElementById('heightVal').textContent = ht.toFixed(2);
    }

    document.getElementById('resetBtn').onclick = () => {
      ['breast','waist','hips','height'].forEach(id => document.getElementById(id).value = 1);
      updateCharacter();
    };
    ['breast','waist','hips','height'].forEach(id => document.getElementById(id).oninput = updateCharacter);

    window.onresize = () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    };
    (function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
  </script>
</body>
</html>
