<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Naakte Vrouw Prototype v10</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a12; color: #eee; overflow: hidden; }
    #ui {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.85);
      padding: 12px;
      border-radius: 12px;
      max-height: 45vh;
      overflow-y: auto;
      font-size: 14px;
      z-index: 100;
    }
    .slider-row { display: flex; align-items: center; margin: 6px 0; gap: 8px; }
    .slider-row label { width: 80px; font-size: 13px; }
    .slider-row input[type=range] { flex: 1; }
    .slider-row span { width: 40px; text-align: right; font-size: 12px; }
    button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      margin: 4px;
      font-size: 14px;
    }
    h3 { margin-bottom: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="ui">
    <h3>Naakte Vrouw <span style="color:#e91e63;">v10</span></h3>
    <div class="slider-row">
      <label>Borsten</label>
      <input type="range" id="breast" min="0.5" max="2.0" step="0.05" value="1">
      <span id="breastVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Taille</label>
      <input type="range" id="waist" min="0.6" max="1.4" step="0.05" value="1">
      <span id="waistVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Heupen</label>
      <input type="range" id="hips" min="0.7" max="1.8" step="0.05" value="1">
      <span id="hipsVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Lengte</label>
      <input type="range" id="height" min="0.8" max="1.2" step="0.02" value="1">
      <span id="heightVal">1.0</span>
    </div>
    <button id="resetBtn">Reset</button>
    <p style="margin-top:8px; font-size:12px; opacity:0.7;">Sleep om te draaien</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x1a1a2e);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;
    controls.update();

    const skinMat = new THREE.MeshBasicMaterial({ color: 0xf5d0b5 });
    const bodyParts = {};
    const characterGroup = new THREE.Group();

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 32), skinMat);
    head.position.y = 1.65;
    characterGroup.add(head);

    // Neck
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.06, 0.14, 16), skinMat);
    neck.position.y = 1.5;
    characterGroup.add(neck);

    // Torso
    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.14, 0.5, 24), skinMat);
    torso.position.y = 1.2;
    bodyParts.torso = torso;
    characterGroup.add(torso);

    // Breasts
    const breastL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 24), skinMat);
    breastL.position.set(-0.09, 1.28, 0.1);
    bodyParts.breastL = breastL;
    characterGroup.add(breastL);

    const breastR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 24), skinMat);
    breastR.position.set(0.09, 1.28, 0.1);
    bodyParts.breastR = breastR;
    characterGroup.add(breastR);

    // Hips
    const hips = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 0.28, 24), skinMat);
    hips.position.y = 0.88;
    bodyParts.hips = hips;
    characterGroup.add(hips);

    // Pelvis
    const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 20), skinMat);
    pelvis.position.y = 0.72;
    characterGroup.add(pelvis);

    // Arms
    const armGeo = new THREE.CylinderGeometry(0.045, 0.035, 0.6, 12);
    const armL = new THREE.Mesh(armGeo, skinMat);
    armL.position.set(-0.26, 1.2, 0);
    armL.rotation.z = 0.15;
    characterGroup.add(armL);
    const armR = new THREE.Mesh(armGeo, skinMat);
    armR.position.set(0.26, 1.2, 0);
    armR.rotation.z = -0.15;
    characterGroup.add(armR);

    // Legs
    const legGeo = new THREE.CylinderGeometry(0.065, 0.045, 0.85, 16);
    const legL = new THREE.Mesh(legGeo, skinMat);
    legL.position.set(-0.09, 0.38, 0);
    characterGroup.add(legL);
    const legR = new THREE.Mesh(legGeo, skinMat);
    legR.position.set(0.09, 0.38, 0);
    characterGroup.add(legR);

    // Feet
    const footGeo = new THREE.BoxGeometry(0.07, 0.03, 0.13);
    const footL = new THREE.Mesh(footGeo, skinMat);
    footL.position.set(-0.09, 0.02, 0.03);
    characterGroup.add(footL);
    const footR = new THREE.Mesh(footGeo, skinMat);
    footR.position.set(0.09, 0.02, 0.03);
    characterGroup.add(footR);

    scene.add(characterGroup);

    function updateCharacter() {
      const b = parseFloat(document.getElementById('breast').value);
      const w = parseFloat(document.getElementById('waist').value);
      const h = parseFloat(document.getElementById('hips').value);
      const ht = parseFloat(document.getElementById('height').value);

      bodyParts.breastL.scale.set(b, b, b);
      bodyParts.breastR.scale.set(b, b, b);
      bodyParts.torso.scale.x = w;
      bodyParts.torso.scale.z = w;
      bodyParts.hips.scale.x = h;
      bodyParts.hips.scale.z = h * 0.85;
      characterGroup.scale.y = ht;

      document.getElementById('breastVal').textContent = b.toFixed(1);
      document.getElementById('waistVal').textContent = w.toFixed(1);
      document.getElementById('hipsVal').textContent = h.toFixed(1);
      document.getElementById('heightVal').textContent = ht.toFixed(2);
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('breast').value = 1;
      document.getElementById('waist').value = 1;
      document.getElementById('hips').value = 1;
      document.getElementById('height').value = 1;
      updateCharacter();
    });

    ['breast','waist','hips','height'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateCharacter);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
