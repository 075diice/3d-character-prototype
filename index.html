<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Character Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; overflow: hidden; }
    #container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.75);
      padding: 12px;
      border-radius: 12px;
      max-height: 45vh;
      overflow-y: auto;
      font-size: 14px;
    }
    .slider-row { display: flex; align-items: center; margin: 6px 0; gap: 8px; }
    .slider-row label { width: 70px; font-size: 13px; }
    .slider-row input[type=range] { flex: 1; }
    .slider-row span { width: 40px; text-align: right; font-size: 12px; }
    button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      margin: 4px;
      font-size: 14px;
    }
    h3 { margin-bottom: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="ui">
    <h3>3D Character Prototype</h3>
    <div class="slider-row">
      <label>Borsten</label>
      <input type="range" id="breast" min="0.5" max="2.5" step="0.05" value="1">
      <span id="breastVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Taille</label>
      <input type="range" id="waist" min="0.5" max="1.5" step="0.05" value="1">
      <span id="waistVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Heupen</label>
      <input type="range" id="hips" min="0.7" max="2" step="0.05" value="1">
      <span id="hipsVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Lengte</label>
      <input type="range" id="height" min="0.8" max="1.3" step="0.02" value="1">
      <span id="heightVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Huid</label>
      <input type="color" id="skin" value="#f5c6a5">
    </div>
    <button id="poseBtn">Pose wisselen</button>
    <button id="resetBtn">Reset</button>
    <p style="margin-top:8px; font-size:12px; opacity:0.7;">Sleep om te draaien • Pinch om te zoomen</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);
    scene.fog = new THREE.Fog(0x1a1a2e, 5, 15);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.minDistance = 1.5;
    controls.maxDistance = 8;
    controls.update();

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(3, 5, 2);
    dirLight.castShadow = true;
    scene.add(dirLight);
    const rim = new THREE.DirectionalLight(0xffaacc, 0.4);
    rim.position.set(-2, 3, -2);
    scene.add(rim);

    // Ground
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.8 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Character group
    const character = new THREE.Group();
    scene.add(character);

    // Materials
    const skinMat = new THREE.MeshStandardMaterial({
      color: 0xf5c6a5,
      roughness: 0.6,
      metalness: 0.1
    });
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.7 });
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

    // Body parts
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 32), skinMat);
    head.position.y = 1.65;
    head.castShadow = true;
    character.add(head);

    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.24, 32, 32), hairMat);
    hair.position.y = 1.72;
    hair.scale.set(1, 0.85, 1);
    character.add(hair);

    const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 16), eyeMat);
    leftEye.position.set(-0.08, 1.68, 0.18);
    character.add(leftEye);
    const rightEye = leftEye.clone();
    rightEye.position.x = 0.08;
    character.add(rightEye);

    const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.16, 0.5, 24), skinMat);
    torso.position.y = 1.25;
    torso.castShadow = true;
    character.add(torso);

    // Breasts
    const leftBreast = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 24), skinMat);
    leftBreast.position.set(-0.12, 1.38, 0.12);
    leftBreast.castShadow = true;
    character.add(leftBreast);
    const rightBreast = leftBreast.clone();
    rightBreast.position.x = 0.12;
    character.add(rightBreast);

    const waist = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.15, 0.2, 24), skinMat);
    waist.position.y = 0.95;
    waist.castShadow = true;
    character.add(waist);

    const hips = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 24), skinMat);
    hips.position.y = 0.82;
    hips.scale.set(1, 0.7, 0.8);
    hips.castShadow = true;
    character.add(hips);

    // Legs
    const leftThigh = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.07, 0.45, 16), skinMat);
    leftThigh.position.set(-0.1, 0.5, 0);
    leftThigh.castShadow = true;
    character.add(leftThigh);
    const rightThigh = leftThigh.clone();
    rightThigh.position.x = 0.1;
    character.add(rightThigh);

    const leftCalf = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.4, 16), skinMat);
    leftCalf.position.set(-0.1, 0.15, 0);
    leftCalf.castShadow = true;
    character.add(leftCalf);
    const rightCalf = leftCalf.clone();
    rightCalf.position.x = 0.1;
    character.add(rightCalf);

    // Arms (simple)
    const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.55, 12), skinMat);
    leftArm.position.set(-0.28, 1.2, 0);
    leftArm.rotation.z = 0.3;
    leftArm.castShadow = true;
    character.add(leftArm);
    const rightArm = leftArm.clone();
    rightArm.position.x = 0.28;
    rightArm.rotation.z = -0.3;
    character.add(rightArm);

    // Store original scales
    const parts = {
      leftBreast, rightBreast, waist, hips, torso,
      leftThigh, rightThigh, leftCalf, rightCalf
    };

    let pose = 0;
    const poses = [
      () => { // Neutral
        leftArm.rotation.z = 0.3;
        rightArm.rotation.z = -0.3;
        leftArm.rotation.x = 0;
        rightArm.rotation.x = 0;
        leftThigh.rotation.x = 0;
        rightThigh.rotation.x = 0;
      },
      () => { // Arms up
        leftArm.rotation.z = 1.2;
        rightArm.rotation.z = -1.2;
        leftArm.rotation.x = -0.3;
        rightArm.rotation.x = -0.3;
      },
      () => { // Legs apart
        leftThigh.rotation.z = 0.4;
        rightThigh.rotation.z = -0.4;
        leftThigh.rotation.x = 0.2;
        rightThigh.rotation.x = 0.2;
      }
    ];

    function updateCharacter() {
      const b = parseFloat(document.getElementById('breast').value);
      const w = parseFloat(document.getElementById('waist').value);
      const h = parseFloat(document.getElementById('hips').value);
      const ht = parseFloat(document.getElementById('height').value);
      const skinColor = document.getElementById('skin').value;

      leftBreast.scale.set(b, b, b);
      rightBreast.scale.set(b, b, b);
      waist.scale.set(w, 1, w * 0.9);
      hips.scale.set(h, 0.7, h * 0.8);
      torso.scale.set(1 + (b-1)*0.15, 1, 1 + (b-1)*0.1);
      character.scale.set(1, ht, 1);

      skinMat.color.set(skinColor);

      document.getElementById('breastVal').textContent = b.toFixed(1);
      document.getElementById('waistVal').textContent = w.toFixed(1);
      document.getElementById('hipsVal').textContent = h.toFixed(1);
      document.getElementById('heightVal').textContent = ht.toFixed(2);
    }

    // Events
    ['breast','waist','hips','height'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateCharacter);
    });
    document.getElementById('skin').addEventListener('input', updateCharacter);

    document.getElementById('poseBtn').addEventListener('click', () => {
      pose = (pose + 1) % poses.length;
      poses[pose]();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('breast').value = 1;
      document.getElementById('waist').value = 1;
      document.getElementById('hips').value = 1;
      document.getElementById('height').value = 1;
      document.getElementById('skin').value = '#f5c6a5';
      pose = 0;
      poses[0]();
      updateCharacter();
    });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
    updateCharacter();
  </script>
</body>
</html>
