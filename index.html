<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>v9 TEST</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    #ui { position: absolute; bottom: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; z-index: 100; }
  </style>
</head>
<body>
  <div id="ui"><h3>v9 TEST - Rode bol</h3><p id="status">Laden...</p></div>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    const status = document.getElementById('status');
    try {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111122);
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
      camera.position.z = 3;
      const renderer = new THREE.WebGLRenderer();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x111122);
      document.body.appendChild(renderer.domElement);
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(1, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0xff0000 })
      );
      scene.add(sphere);
      function animate() {
        requestAnimationFrame(animate);
        sphere.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
      status.textContent = 'WebGL OK - rode bol moet zichtbaar zijn';
    } catch(e) {
      status.textContent = 'FOUT: ' + e.message;
    }
  </script>
</body>
</html>
