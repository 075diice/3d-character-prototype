<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Naakte Vrouw Prototype v12</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a12; color: #eee; overflow: hidden; }
    #ui {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0,0,0,0.85);
      padding: 12px;
      border-radius: 12px;
      max-height: 45vh;
      overflow-y: auto;
      font-size: 14px;
      z-index: 100;
    }
    .slider-row { display: flex; align-items: center; margin: 6px 0; gap: 8px; }
    .slider-row label { width: 80px; font-size: 13px; }
    .slider-row input[type=range] { flex: 1; }
    .slider-row span { width: 40px; text-align: right; font-size: 12px; }
    button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      margin: 4px;
      font-size: 14px;
    }
    h3 { margin-bottom: 8px; font-size: 16px; }
    #status { font-size: 12px; color: #aaa; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="ui">
    <h3>Naakte Vrouw <span style="color:#e91e63;">v12</span></h3>
    <div id="status">Model laden...</div>
    <div class="slider-row">
      <label>Borsten</label>
      <input type="range" id="breast" min="0.5" max="2.0" step="0.05" value="1">
      <span id="breastVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Taille</label>
      <input type="range" id="waist" min="0.6" max="1.4" step="0.05" value="1">
      <span id="waistVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Heupen</label>
      <input type="range" id="hips" min="0.7" max="1.8" step="0.05" value="1">
      <span id="hipsVal">1.0</span>
    </div>
    <div class="slider-row">
      <label>Lengte</label>
      <input type="range" id="height" min="0.8" max="1.2" step="0.02" value="1">
      <span id="heightVal">1.0</span>
    </div>
    <button id="resetBtn">Reset</button>
    <p style="margin-top:8px; font-size:12px; opacity:0.7;">Sleep om te draaien</p>
  </div>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x1a1a2e);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.0, 0);
    controls.enableDamping = true;
    controls.minDistance = 1.2;
    controls.maxDistance = 6;
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(3, 5, 3);
    scene.add(dir);

    let model = null;
    const status = document.getElementById('status');

    const loader = new GLTFLoader();
    // CC0 female base mesh from Innerscene (MakeHuman based)
    const modelUrl = 'https://www.innerscene.com/api/library/female-base-mesh-3d-person-rigged-a-pose-dba97ed5/model.glb';

    loader.load(modelUrl, (gltf) => {
      model = gltf.scene;
      model.scale.set(1.2, 1.2, 1.2);
      model.position.y = 0;
      scene.add(model);
      status.textContent = 'Model geladen (CC0)';
      updateCharacter();
    }, undefined, (err) => {
      status.textContent = 'Fout bij laden: ' + err.message;
      console.error(err);
    });

    function updateCharacter() {
      if (!model) return;
      const b = parseFloat(document.getElementById('breast').value);
      const w = parseFloat(document.getElementById('waist').value);
      const h = parseFloat(document.getElementById('hips').value);
      const ht = parseFloat(document.getElementById('height').value);

      model.scale.set(1.2 * (1 + (b-1)*0.15), 1.2 * ht, 1.2 * (1 + (h-1)*0.2));

      document.getElementById('breastVal').textContent = b.toFixed(1);
      document.getElementById('waistVal').textContent = w.toFixed(1);
      document.getElementById('hipsVal').textContent = h.toFixed(1);
      document.getElementById('heightVal').textContent = ht.toFixed(2);
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('breast').value = 1;
      document.getElementById('waist').value = 1;
      document.getElementById('hips').value = 1;
      document.getElementById('height').value = 1;
      updateCharacter();
    });

    ['breast','waist','hips','height'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateCharacter);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
